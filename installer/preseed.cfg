# Gringotts — Debian 13 automated installer
# Target hardware: Beelink ME Mini (Intel N150)
# Also tested on: UTM x86_64 VM (NVMe interface, UEFI)
#
# Usage — build-usb.sh embeds this file into the installer initrd.
# The preseed is never served over HTTP; it is loaded via file=/preseed.cfg
# from inside the initrd that build-usb.sh prepends.
#
# Build a modified ISO (and optionally write to USB):
#   ./build-usb.sh                                     # download + build ISO only
#   ./build-usb.sh <iso> <device>                      # also write to USB
#
# UTM testing: attach the output *-gringotts.iso as the CD-ROM drive.

### Auto mode — enables fully unattended install once preseed is loaded
d-i auto-install/enable boolean true
d-i debconf/priority string critical

### Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string gringotts
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

### Debian mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Partitioning
# Auto-detect the first available disk — handles nvme0n1 (Beelink) and
# vda/sda (UTM VMs). Sets only partman-auto/disk here; grub-installer/bootdev
# is set later via "string default" (its templates aren't loaded this early,
# and setting it here returned non-zero, aborting the whole early_command).
# Trailing "true" guarantees exit 0 so d-i does not abort.
d-i preseed/early_command string \
  for d in nvme0n1 vda sda; do \
    if [ -b /dev/$d ]; then debconf-set partman-auto/disk /dev/$d; break; fi; \
  done; true

d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
# Use GPT explicitly (required for UEFI)
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
# Suppress "no swap" warning — ZFS handles memory pressure
d-i partman-basicfilesystems/no_swap boolean true

# Layout:
#   p1  512 MB   EFI System Partition (vfat)
#   p2    1 GB   /boot (ext4)
#   p3   30 GB   /     (ext4)
#   p4 remainder data  (ext4, labelled "gringotts" via late_command)
#                      wizard creates ZFS tank pool here
#
# NOTE: no trailing spaces before \ — they break debconf continuation parsing
d-i partman-auto/expert_recipe string \
  gringotts-layout :: \
    538 538 538 vfat \
      $iflabel{ gpt } \
      method{ efi } \
      format{ } \
      use_filesystem{ } \
      filesystem{ vfat } \
      mountpoint{ /boot/efi } \
    . \
    1024 1024 1024 ext4 \
      $primary{ } \
      method{ format } format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ /boot } \
    . \
    30720 30720 30720 ext4 \
      $primary{ } \
      method{ format } format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ / } \
    . \
    1 1 1000000000 ext4 \
      $primary{ } \
      method{ format } format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ /data } \
    .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_mount_point boolean true

### Apt
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true

### Packages
d-i tasksel/first multiselect standard
d-i pkgsel/include string openssh-server sudo curl
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### User — password is prompted interactively (not hardcoded)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Goblin
d-i passwd/username string goblin
d-i passwd/user-groups string sudo

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

### Post-install
# Set GPT PARTLABEL on p4 — survives ZFS overwriting the filesystem.
# Wizard finds it via: blkid -t PARTLABEL=gringotts  or  /dev/disk/by-partlabel/gringotts
d-i preseed/late_command string \
  umount /target/data 2>/dev/null || true ; \
  sed -i '/[[:space:]]\/data[[:space:]]/d' /target/etc/fstab ; \
  rmdir /target/data 2>/dev/null || true ; \
  for d in nvme0n1 vda sda; do \
    [ -b /dev/${d}p4 ] && parted -s /dev/$d name 4 gringotts && break ; \
    [ -b /dev/${d}4  ] && parted -s /dev/$d name 4 gringotts && break ; \
  done ; \
  in-target systemctl enable ssh

### Finish
d-i finish-install/reboot_in_progress note