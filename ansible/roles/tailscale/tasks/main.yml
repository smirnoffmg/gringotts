---
- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/sid.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/sid.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read Tailscale login state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Connect to Tailscale network
  ansible.builtin.command:
    cmd: tailscale up --authkey={{ tailscale_authkey }}
  changed_when: true
  no_log: true
  when:
    - tailscale_authkey != ""
    - tailscale_status.stdout is not search('"BackendState":\s*"Running"')

# With accept-dns on, tailscaled and dhcpcd race over /etc/resolv.conf; losing
# the race left the host with no upstream resolver.
- name: Apply Tailscale preferences
  ansible.builtin.command:
    cmd: tailscale set --accept-dns=false --accept-routes
  changed_when: false
