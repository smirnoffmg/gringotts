---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - sudo
      - curl
      - parted
      - locales
      - dpkg-dev
      - linux-headers-generic
      - linux-image-generic
    state: present
    update_cache: true

- name: Add trixie-backports repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/trixie-backports.list
    content: |
      deb http://deb.debian.org/debian trixie-backports main contrib non-free-firmware
      deb-src http://deb.debian.org/debian trixie-backports main contrib non-free-firmware
    mode: "0644"

- name: Pin zfs-linux to backports
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/90_zfs
    content: |
      Package: src:zfs-linux
      Pin: release n=trixie-backports
      Pin-Priority: 990
    mode: "0644"

- name: Install ZFS packages
  ansible.builtin.apt:
    name:
      - zfs-dkms
      - zfsutils-linux
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Set default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      LANG=en_US.UTF-8
      LC_ALL=en_US.UTF-8
    mode: "0644"

- name: Add user to sudo group - {{ gringotts_user }}
  ansible.builtin.user:
    name: "{{ gringotts_user }}"
    groups: sudo
    append: true

- name: Install avahi-daemon and dnsmasq
  ansible.builtin.apt:
    name:
      - avahi-daemon
      - dnsmasq
    state: present

- name: Enable and start avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started

- name: Configure dnsmasq for gringotts.local wildcard
  ansible.builtin.template:
    src: dnsmasq-gringotts.conf.j2
    dest: /etc/dnsmasq.d/gringotts.conf
    mode: "0644"
  notify: Restart dnsmasq

- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started

- name: Label data partition as gringotts
  ansible.builtin.command:
    cmd: /sbin/parted -s {{ gringotts_disk }} name {{ gringotts_data_partition }} gringotts
  changed_when: true
