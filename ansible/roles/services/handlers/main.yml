---
- name: Restart xray
  community.docker.docker_compose_v2:
    project_src: "{{ gringotts_compose_dir }}/xray"
    state: present
    recreate: always

- name: Restart decluttarr
  community.docker.docker_compose_v2:
    project_src: "{{ gringotts_compose_dir }}/media-stack"
    services: [decluttarr]
    state: restarted
