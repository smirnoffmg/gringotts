---
- name: Require a real Immich database password
  ansible.builtin.assert:
    that: immich_db_password | length >= 16
    fail_msg: "Set immich_db_password in group_vars/beelink/vault.yml"
  no_log: true

- name: Check xray config exists
  ansible.builtin.stat:
    path: /tank/services/xray/config.json
  register: xray_config

- name: Fail if xray config is missing
  ansible.builtin.fail:
    msg: "xray config.json not found at /tank/services/xray/config.json — copy it before running this playbook"
  when: not xray_config.stat.exists

- name: Set ownership on ZFS service datasets
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ gringotts_user }}"
    group: "{{ gringotts_user }}"
    mode: "0700"
    state: directory
  loop:
    - /tank/services/xray
    - /tank/services/seerr
    - /tank/services/sonarr
    - /tank/services/radarr
    - /tank/services/prowlarr
    - /tank/services/qbittorrent
    - /tank/services/decluttarr
    - /tank/services/maintainerr
    - /tank/services/jellyfin
    - /tank/media/tv
    - /tank/media/movies
    - /tank/photos
    - /tank/downloads

- name: Create compose directories
  ansible.builtin.file:
    path: "{{ gringotts_compose_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - media-stack
    - immich
    - xray

- name: Deploy media-stack compose file
  ansible.builtin.copy:
    src: media-stack.yml
    dest: "{{ gringotts_compose_dir }}/media-stack/docker-compose.yml"
    mode: "0644"

- name: Deploy media-stack env file
  ansible.builtin.template:
    src: media-stack.env.j2
    dest: "{{ gringotts_compose_dir }}/media-stack/.env"
    mode: "0640"

- name: Check Radarr has been initialised
  ansible.builtin.stat:
    path: /tank/services/radarr/radarr.db
  register: radarr_db

- name: Check Sonarr has been initialised
  ansible.builtin.stat:
    path: /tank/services/sonarr/sonarr.db
  register: sonarr_db

# Decluttarr needs the Radarr and Sonarr API keys and the qBittorrent
# credentials Radarr already stores; reading them on the host keeps secrets
# out of the repo.
- name: Read decluttarr credentials from Radarr and Sonarr
  ansible.builtin.script:
    cmd: decluttarr_credentials.py
    executable: python3
  register: decluttarr_credentials
  changed_when: false
  no_log: true
  when: radarr_db.stat.exists and sonarr_db.stat.exists

- name: Deploy decluttarr config
  ansible.builtin.template:
    src: decluttarr.yaml.j2
    dest: /tank/services/decluttarr/config.yaml
    owner: "{{ gringotts_user }}"
    group: "{{ gringotts_user }}"
    mode: "0600"
  vars:
    creds: "{{ decluttarr_credentials.stdout | from_json }}"
    radarr_api_key: "{{ creds.radarr_api_key }}"
    sonarr_api_key: "{{ creds.sonarr_api_key }}"
    qbittorrent_username: "{{ creds.qbittorrent_username }}"
    qbittorrent_password: "{{ creds.qbittorrent_password }}"
  no_log: true
  when: radarr_db.stat.exists and sonarr_db.stat.exists
  notify: Restart decluttarr

- name: Deploy immich compose file
  ansible.builtin.copy:
    src: immich.yml
    dest: "{{ gringotts_compose_dir }}/immich/docker-compose.yml"
    mode: "0644"

- name: Deploy immich env file
  ansible.builtin.template:
    src: immich.env.j2
    dest: "{{ gringotts_compose_dir }}/immich/.env"
    mode: "0640"

- name: Deploy xray compose file
  ansible.builtin.copy:
    src: xray.yml
    dest: "{{ gringotts_compose_dir }}/xray/docker-compose.yml"
    mode: "0644"

- name: Start media-stack
  community.docker.docker_compose_v2:
    project_src: "{{ gringotts_compose_dir }}/media-stack"
    state: present
    profiles: "{{ ['decluttarr'] if (radarr_db.stat.exists and sonarr_db.stat.exists) else [] }}"

- name: Start immich
  community.docker.docker_compose_v2:
    project_src: "{{ gringotts_compose_dir }}/immich"
    state: present

- name: Start xray
  community.docker.docker_compose_v2:
    project_src: "{{ gringotts_compose_dir }}/xray"
    state: present

# Plex for PS5 stalls on embedded SRT tracks; sidecar files play smoothly.
- name: Install ffmpeg for subtitle extraction
  ansible.builtin.apt:
    name: ffmpeg
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Create gringotts script directory
  ansible.builtin.file:
    path: /usr/local/lib/gringotts
    state: directory
    mode: "0755"

- name: Deploy Plex subtitle extraction script
  ansible.builtin.copy:
    src: plex_subtitles.py
    dest: /usr/local/lib/gringotts/plex_subtitles.py
    mode: "0755"

- name: Deploy Plex subtitle extraction service
  ansible.builtin.template:
    src: plex-subtitles.service.j2
    dest: /etc/systemd/system/plex-subtitles.service
    mode: "0644"

- name: Deploy Plex subtitle extraction timer
  ansible.builtin.copy:
    src: plex-subtitles.timer
    dest: /etc/systemd/system/plex-subtitles.timer
    mode: "0644"

- name: Enable Plex subtitle extraction timer
  ansible.builtin.systemd_service:
    name: plex-subtitles.timer
    enabled: true
    state: started
    daemon_reload: true
